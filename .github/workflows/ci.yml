name: CI/CD - Diabetes Risk Prediction

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ========================================================
  # 1. TESTS
  # ========================================================

  test:

    name: Tests Python

    runs-on: ubuntu-latest

    steps:

      # Récupération du code
      - name: Checkout du code
        uses: actions/checkout@v4


      # Installation Python
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # Installation des dépendances
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # Vérification des librairies
      - name: Vérifier les librairies
        run: |
          python -c "import pandas"
          python -c "import numpy"
          python -c "import sklearn"
          python -c "import xgboost"


      # Vérification syntaxique
      - name: Vérifier la syntaxe
        run: |
          python -m compileall src app.py


  # ========================================================
  # 2. BUILD DOCKER
  # ========================================================

  docker:

    name: Build Docker

    runs-on: ubuntu-latest

    needs: test

    steps:

      # Récupération du code
      - name: Checkout du code
        uses: actions/checkout@v4


      # Installation Docker
      - name: Installer Docker
        uses: docker/setup-buildx-action@v3


      # Construction de l'image
      - name: Build de l'image Docker
        run: |
          docker build -t diabetes-risk-app .


      # Vérification de l'image
      - name: Vérifier l'image Docker
        run: |
          docker images
