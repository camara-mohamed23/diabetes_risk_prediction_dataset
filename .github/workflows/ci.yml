name: CI - Diabetes Risk Prediction

# Quand lancer le workflow ?
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Les tâches à effectuer
jobs:

  # Nom de la machine virtuelle
  test:

    # Système utilisé par GitHub
    runs-on: ubuntu-latest

    steps:

      # 1. Récupérer le code du dépôt
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Installer Python
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Mettre pip à jour
      - name: Mettre pip à jour
        run: |
          python -m pip install --upgrade pip

      # 4. Installer les dépendances
      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt

      # 5. Vérifier que Python fonctionne
      - name: Vérifier Python
        run: |
          python --version

      # 6. Vérifier que les bibliothèques principales fonctionnent
      - name: Vérifier les dépendances
        run: |
          python -c "import pandas"
          python -c "import numpy"
          python -c "import sklearn"
          python -c "import xgboost"

      # 7. Vérifier la syntaxe Python
      - name: Vérifier la syntaxe
        run: |
          python -m compileall src app.py
